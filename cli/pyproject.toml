[project]
name = "incident-os-cli"
version = "0.1.0"
description = "Incident OS command-line interface: emit telemetry, browse incidents, and run investigations"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-semantic-conventions>=0.49b0",
]

[project.scripts]
incident-os = "incident_os_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["incident_os_cli*"]

[tool.setuptools.package-data]
incident_os_cli = ["*.html"]
