[project]
name = "incident-os-simulator"
version = "0.1.0"
description = "Demo production system for Incident OS: real services emitting real OTel telemetry."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "confluent-kafka>=2.5",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-semantic-conventions>=0.49b0",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]
