zerops:
  - setup: api
    build:
      base: ubuntu/python@3.12
      buildCommands:
        - python -m pip install --target=./vendor ./backend
      deployFiles:
        - ./backend
        - ./vendor
      cache:
        - vendor
    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /api/v1/health
    run:
      base: ubuntu/python@3.12
      initCommands:
        - zsc execOnce ${appVersionId} --retryUntilSuccessful -- python -m alembic -c /var/www/backend/alembic.ini upgrade head
      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        PYTHONPATH: /var/www/vendor

  - setup: worker
    build:
      base: ubuntu/python@3.12
      buildCommands:
        - python -m pip install --target=./vendor ./backend
      deployFiles:
        - ./backend
        - ./vendor
      cache:
        - vendor
    run:
      base: ubuntu/python@3.12
      start: python -m app.worker
      envVariables:
        PYTHONPATH: /var/www/vendor
